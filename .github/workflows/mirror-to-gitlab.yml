name: Mirror GitHub to GitLab

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

concurrency:
  group: mirror-gitlab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Push refs to GitLab
    runs-on: ubuntu-latest
    env:
      GITLAB_MIRROR_URL: ${{ secrets.GITLAB_MIRROR_URL }}
      GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
      GITLAB_MIRROR_USERNAME: ${{ secrets.GITLAB_MIRROR_USERNAME }}
    steps:
      - name: Checkout repository without LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Validate GitLab mirror configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GITLAB_MIRROR_URL}" ]]; then
            echo "Error: falta configurar el secret GITLAB_MIRROR_URL con la URL HTTPS exacta del repositorio GitLab terminada en .git." >&2
            exit 1
          fi

          if [[ -z "${GITLAB_MIRROR_TOKEN}" ]]; then
            echo "Error: falta configurar el secret GITLAB_MIRROR_TOKEN con un token de GitLab con permiso write_repository." >&2
            exit 1
          fi

          if [[ "${GITLAB_MIRROR_URL}" != https://* ]]; then
            echo "Error: GITLAB_MIRROR_URL debe comenzar con https://. Copiá la URL desde GitLab → Code → Clone with HTTPS." >&2
            exit 1
          fi

          if [[ "${GITLAB_MIRROR_URL}" != *.git ]]; then
            echo "Error: GITLAB_MIRROR_URL debe terminar en .git. Copiá la URL exacta desde GitLab → Code → Clone with HTTPS." >&2
            exit 1
          fi

      - name: Configure GitLab HTTPS credentials
        shell: bash
        run: |
          set -euo pipefail

          mirror_username="${GITLAB_MIRROR_USERNAME:-lu-developer476}"
          credentials_file="${RUNNER_TEMP}/gitlab-credentials"

          echo "::add-mask::${GITLAB_MIRROR_TOKEN}"
          rm -f "${credentials_file}"

          gitlab_host="$(
            python - <<'PY'
          import os
          from urllib.parse import urlsplit

          parsed = urlsplit(os.environ["GITLAB_MIRROR_URL"])
          if parsed.scheme != "https" or not parsed.hostname:
              raise SystemExit("GITLAB_MIRROR_URL no contiene un host HTTPS válido")

          host = parsed.hostname
          if parsed.port is not None:
              host = f"{host}:{parsed.port}"

          print(host)
          PY
          )"

          git config --local credential.helper "store --file=${credentials_file}"
          git config --local credential.useHttpPath false

          printf 'protocol=https\nhost=%s\nusername=%s\npassword=%s\n\n' \
            "${gitlab_host}" \
            "${mirror_username}" \
            "${GITLAB_MIRROR_TOKEN}" \
            | git credential approve

          git remote remove gitlab 2>/dev/null || true
          git remote add gitlab "${GITLAB_MIRROR_URL}"

          git config --local remote.gitlab.lfspushurl \
            "${GITLAB_MIRROR_URL}/info/lfs"

          if ! git ls-remote --heads --tags gitlab >/dev/null; then
            echo "Error: el repositorio GitLab no respondió con las credenciales configuradas. Verificá GITLAB_MIRROR_URL, GITLAB_MIRROR_USERNAME y GITLAB_MIRROR_TOKEN." >&2
            exit 1
          fi

      - name: Sync Git LFS objects to GitLab
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v git-lfs >/dev/null 2>&1; then
            echo "Error: git-lfs no está disponible en el runner. No se puede sincronizar Git LFS hacia GitLab." >&2
            exit 1
          fi

          git lfs install --local

          if ! git lfs fetch origin HEAD; then
            echo "Error: GitHub no entregó los objetos Git LFS requeridos por HEAD. Revisá la cuota, disponibilidad o permisos de Git LFS en GitHub antes de reintentar el mirror." >&2
            exit 1
          fi

          git lfs fsck

          lfs_oids_file="$(mktemp)"
          trap 'rm -f "${lfs_oids_file}"' EXIT

          git lfs ls-files --long HEAD \
            | awk '{print $1}' \
            | sort -u > "${lfs_oids_file}"

          if [[ -s "${lfs_oids_file}" ]]; then
            if ! git lfs push --object-id gitlab --stdin < "${lfs_oids_file}"; then
              echo "Error: GitLab rechazó o no recibió los objetos Git LFS usados por HEAD. La autenticación se configuró mediante el credential helper de Git; comprobá también que Git LFS esté habilitado en el proyecto y que el token conserve write_repository." >&2
              exit 1
            fi
          else
            echo "HEAD no contiene objetos Git LFS; no hay binarios que sincronizar."
          fi

      - name: Mirror pushed branch
        if: github.ref_type == 'branch'
        shell: bash
        run: |
          set -euo pipefail

          branch="${GITHUB_REF_NAME}"

          git fetch gitlab \
            "+refs/heads/${branch}:refs/remotes/gitlab/${branch}" || true

          GIT_LFS_SKIP_PUSH=1 git push gitlab \
            "HEAD:refs/heads/${branch}" \
            --force-with-lease

      - name: Mirror pushed tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"

          GIT_LFS_SKIP_PUSH=1 git push gitlab \
            "refs/tags/${tag}:refs/tags/${tag}"

      - name: Remove temporary GitLab credentials
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/gitlab-credentials"
