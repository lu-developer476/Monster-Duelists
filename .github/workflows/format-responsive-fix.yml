name: Format responsive fix

on:
  push:
    branches:
      - fix/responsive-breakpoints-and-board-actions

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx prettier --write core/static/core/js/game/board-actions.js tests/js/layout-gap.test.js
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/static/core/js/game/board-actions.js tests/js/layout-gap.test.js
          git commit -m "style: apply Prettier formatting"
          git push origin HEAD:fix/responsive-breakpoints-and-board-actions
